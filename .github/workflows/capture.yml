name: capture pairip.json (rooted ARM64 emulator)

# The Play-signed app runs unmodified on a rooted emulator, so no patched
# build, CorePatch or native bypass is needed. frida-server dumps the
# populated junk fields, dpairip translates the clean merged APK offline.
#
# Untested until run on GitHub: PairIP may refuse to start inside an emulator.

on:
  workflow_dispatch:
    inputs:
      apks_url:
        description: Direct URL to the target .xapk / .apks
        required: true
      package:
        description: Application id, e.g. com.tempmail
        required: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          # Some arm64 runners have no KVM device; udevadm then exits non-zero.
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then
            echo "HW_ACCEL=false" >> "$GITHUB_ENV"
            ls -l /dev/kvm
          else
            echo "HW_ACCEL=true" >> "$GITHUB_ENV"
            echo "WARNING: /dev/kvm is unavailable; emulator will be slow"
          fi

      - name: Download target and build junk list
        run: |
          set -e
          python -m pip install -e .
          curl -L "${{ inputs.apks_url }}" -o target.xapk
          python -m dpairip.cli -i target.xapk -o work --no-color
          test -s work/junk_classes.txt

      - name: Emulator + Frida capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-linux-hw-accel: ${{ env.HW_ACCEL }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          script: bash .github/scripts/emulator_capture.sh "${{ inputs.package }}"

      - name: Upload dictionary
        uses: actions/upload-artifact@v4
        with:
          name: pairip-json
          path: work/pairip.json
          if-no-files-found: error
